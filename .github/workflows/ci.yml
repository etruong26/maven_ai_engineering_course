name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check /health
        run: |
          python -c 'from fastapi.testclient import TestClient; from main import app; r = TestClient(app).get("/health"); assert r.json() == {"status": "ok"}'
